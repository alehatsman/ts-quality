description: >-
  Install the consumer's dependencies (npm ci) plus the Playwright browsers a
  lockfile cannot express, then verify node/npm/biome/tsc are reachable.

props:
  dir:
    type: string
    default: "."
    description: Directory holding the package.json, relative to the invocation dir.

steps:
  # Almost nothing is installed globally on purpose: biome, typescript, vite and
  # playwright are devDependencies pinned by the consumer's own lockfile, and a
  # global copy would mean the gate runs a different version than CI does.
  - name: install
    shell: cd "{{ props.dir }}" && bash "{{ component_dir }}/scripts/tools.sh" install
  # The install step changes real state and cannot say in advance what it will
  # do; `check` only asks, so its exit code is its whole contract.
  - name: verify
    shell: cd "{{ props.dir }}" && bash "{{ component_dir }}/scripts/tools.sh" check
    changed_when: false
