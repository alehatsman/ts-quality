name: ts-quality-lint
description: >-
  Run Biome's verification (biome check = lint + format + assist). Reads the
  consumer's biome.json (which extends the shared baseline).
version: 1.0.0

# `dir` is folded into the command (cd "{{ props.dir }}" && …) rather than the
# step `cwd:` — cwd is rendered at execute time where component props are out of
# scope, so it would resolve empty; the command string is templated at plan-time
# expansion where props ARE in scope.

props:
  dir:
    type: string
    default: "."
    description: Project directory to run in (e.g. "web").
  fix:
    type: bool
    default: false
    description: Apply safe fixes (biome check --write) instead of only checking.

steps:
  - name: biome check
    shell: cd "{{ props.dir }}" && npx biome check {% if props.fix %}--write {% endif %}.
