name: ts-quality-vuln
description: >-
  Audit dependencies for known vulnerabilities (npm audit). Fails when an
  advisory at or above `level` is found. Kept out of the core ci gate by default
  (advisories drift independently of code) — consumers can append it explicitly.
version: 1.0.0

props:
  dir:
    type: string
    default: "."
    description: Project directory to run in (e.g. "web").
  level:
    type: string
    default: "high"
    enum: ["low", "moderate", "high", "critical"]
    description: Minimum severity that fails the audit.
  omit_dev:
    type: bool
    default: true
    description: Audit only production dependencies (npm audit --omit=dev).

steps:
  - name: npm audit
    shell: cd "{{ props.dir }}" && npm audit --audit-level={{ props.level }}{% if props.omit_dev %} --omit=dev{% endif %}
