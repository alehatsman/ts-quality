name: ts-quality-typecheck
description: Type-check the project with the TypeScript compiler (tsc -b). Honors the consumer's tsconfig (noEmit).
version: 1.0.0

props:
  dir:
    type: string
    default: "."
    description: Project directory to run in (e.g. "web").

steps:
  - name: tsc -b
    shell: cd "{{ props.dir }}" && npx tsc -b
