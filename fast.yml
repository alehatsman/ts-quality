description: >-
  Fast pre-commit gate — lockfile drift, biome over staged files, typecheck,
  ai-lint over staged files, soft caps. No build, no test suite, no network.

props:
  dir:
    type: string
    default: "."
    description: >-
      Directory holding the package.json to gate, relative to where provision is
      invoked.
  cap_loc:
    type: string
    default: "500"
    description: God-file soft cap in LOC (informational).
  biome_args:
    type: string
    default: ""
    description: Extra flags appended to every biome invocation.
  tsc_args:
    type: string
    default: ""
    description: >-
      Extra flags appended to `tsc -b`. Reaches only the fallback: when the
      consumer's package.json has a `typecheck` script, the gate runs that
      instead, flags and all.

steps:
  - name: fast gate
    # `cd` before the assignments — see tsq/ci for why the other order loses them.
    shell: >-
      cd "{{ props.dir }}" &&
      CAP_LOC="{{ props.cap_loc }}"
      BIOME_ARGS="{{ props.biome_args }}" TSC_ARGS="{{ props.tsc_args }}"
      bash "{{ component_dir }}/scripts/gate.sh" fast
    changed_when: false
