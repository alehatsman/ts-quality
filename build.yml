name: ts-quality-build
description: Build the production bundle with Vite (vite build). Pair with the typecheck component for type safety.
version: 1.0.0

props:
  dir:
    type: string
    default: "."
    description: Project directory to run in (e.g. "web").

steps:
  - name: vite build
    shell: cd "{{ props.dir }}" && npx vite build
